<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Trash Panda Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #1c2238; --bg-deep: #13182a;
    --tile-a: #2f6d78; --tile-b: #28606b; --counter: #1b2238;
    --path: #ff5a36; --path-soft: rgba(255,90,54,.3);
    --lamp: #ffe066; --text: #f7f2ea; --muted: #a3acc4;
    --fur: #a7adb4; --mask: #2a2f3a; --danger: #ff3b3b; --snack: #fff1c9;
    --font: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #18212f; } }
  :root[data-theme="dark"] { --bg: #18212f; }
  :root[data-kitchen="1"] { --tile-a: #6b5a8f; --tile-b: #5d4e7e; --counter: #241c3a; --bg: #1f1a30; --bg-deep: #15112a; }
  :root[data-kitchen="2"] { --tile-a: #7a6a3c; --tile-b: #6a5c33; --counter: #2b2416; --bg: #26211a; --bg-deep: #1a1711; }
  :root[data-kitchen="3"] { --tile-a: #3e6b4e; --tile-b: #355d44; --counter: #16261c; --bg: #19221c; --bg-deep: #111814; }
  .arrowTile { pointer-events: none; }
  #dailyBtn { font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--lamp); background: none; border: 1px solid var(--lamp); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  #dailyCard { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 10px; z-index: 7; }
  #dailyCard.show { display: flex; }
  #dailyCard h1 { font-size: 30px; font-weight: 600; margin: 0; }
  #dailyCard p { color: var(--muted); margin: 0; max-width: 32ch; }
  #dailyCard .big { font-size: 44px; font-weight: 600; color: var(--lamp); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px 4px; }
  #levelNum { font-size: 28px; font-weight: 600; letter-spacing: .5px; }
  #levelNum small { font-size: 15px; font-weight: 400; color: var(--muted); margin-right: 6px; }
  #spotted { font-size: 14px; color: var(--text); background: rgba(255,59,59,.22); border-radius: 999px; padding: 4px 10px; display: none; }
  #spotted.show { display: inline-block; }
  #spotted b { color: var(--danger); font-weight: 600; }
  #raccoon .pupil { opacity: 1; } #raccoon .xeye { opacity: 0; }
  #raccoon.dead .pupil { opacity: 0; } #raccoon.dead .xeye { opacity: 1; }
  main { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; }
  #board { width: min(96vw, 520px, 72vh); height: auto; display: block; touch-action: none; }
  .hbtn { font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--text); background: #2a3447; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .hbtn:focus-visible { outline: 2px solid var(--lamp); }
  #menu { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; padding: 20px; overflow: auto; z-index: 4; }
  #menu.show { display: flex; }
  #menu h2 { margin: 8px 0 4px; font-weight: 600; font-size: 22px; }
  #menu p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .lgrid { display: grid; grid-template-columns: repeat(5, 56px); gap: 8px; margin-bottom: 18px; }
  .lcell { font-family: var(--font); font-size: 16px; font-weight: 600; height: 48px; border: 0; border-radius: 12px; background: #2a3447; color: var(--text); cursor: pointer; }
  .lcell.done { background: var(--tile-a); }
  .lcell.current { outline: 3px solid var(--path); }
  .lcell:disabled { opacity: .3; cursor: default; }
  .missed { animation: blink .5s ease-in-out 2; }
  @keyframes blink { 50% { fill: var(--danger); } }
  footer { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 6px 20px 14px; font-size: 14px; color: var(--muted); }
  #hintLine { min-height: 1.2em; color: var(--text); }
  #retry { font-family: var(--font); font-size: 15px; color: var(--muted); background: none; border: 0; padding: 6px 0; cursor: pointer; }
  #ver { font-size: 12px; cursor: pointer; margin-left: 12px; }
  #intro { position: fixed; inset: 0; background: rgba(10,13,24,.72); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 6; }
  #intro.show { display: flex; }
  #intro .card { background: var(--bg-deep); border-radius: 22px; padding: 22px 22px 18px; max-width: 340px; width: 100%; text-align: center; }
  #intro .card svg { width: 150px; height: 150px; display: block; margin: 0 auto 10px; }
  #intro h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
  #intro p { margin: 0 0 14px; color: var(--muted); font-size: 16px; line-height: 1.35; }
  #toast { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--bg-deep); color: var(--text); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #end { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 10px; }
  #end.show { display: flex; }
  #end h1 { font-size: 34px; font-weight: 600; margin: 0; }
  #end p { color: var(--muted); margin: 0; max-width: 32ch; }
  #end code { display: block; background: var(--bg-deep); padding: 12px 14px; border-radius: 12px; font-size: 13px; word-break: break-all; max-width: 320px; }
  .btn { font-family: var(--font); font-size: 17px; font-weight: 600; background: var(--path); color: #2a1a06; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer; margin-top: 8px; }
  .btn.quiet { background: #334055; color: var(--text); }
  #debug { position: fixed; top: 0; right: 0; bottom: 0; width: min(92vw, 380px); background: var(--bg-deep); overflow: auto; padding: 12px; font-size: 12px; display: none; z-index: 5; }
  #debug.show { display: block; }
  #debug table { border-collapse: collapse; width: 100%; } #debug td, #debug th { padding: 3px 4px; text-align: left; border-bottom: 1px solid #222c3a; }
  @media (prefers-reduced-motion: reduce) { .missed { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="menuBtn" type="button">Levels</button>
    <div id="levelNum"><small>Level</small><span id="lvlText">1</span></div>
    <button class="hbtn" id="retry" type="button">Start over</button>
  </header>
  <main><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></main>
  <footer><span id="hintLine"></span><span><span id="spotted">Spotted <b id="spotN">0</b></span> <button id="dailyBtn" type="button">Daily</button><span id="ver">raccoon-path-v0.10</span></span></footer>
</div>
<div id="toast"></div>
<div id="dailyCard">
  <h1 id="dailyTitle">Daily puzzle</h1>
  <div class="big" id="dailyTime"></div>
  <p id="dailyText"></p>
  <button class="btn" id="dailyShare" type="button">Share your time</button>
  <button class="btn quiet" id="dailyBack" type="button">Back to levels</button>
</div>
<div id="intro"><div class="card"><div id="introPic"></div><h2 id="introTitle"></h2><p id="introText"></p><button class="btn" id="introOk" type="button">Got it</button></div></div>
<div id="menu">
  <h2 id="menuTitle">Levels</h2>
  <p>Tap any level you have reached.</p>
  <div id="menuGrids"></div>
  <button class="btn quiet" id="menuClose" type="button">Back to the kitchen</button>
</div>
<div id="end">
  <h1>Every kitchen cleaned out</h1>
  <p id="endStats"></p>
  <p>Send this play code back to Yasu:</p>
  <code id="playCode"></code>
  <button class="btn" id="copyCode" type="button">Copy play code</button>
  <button class="btn quiet" id="replay" type="button">Play again from level 1</button>
</div>
<div id="debug"></div>

/* ---------- Input: drag a route. Pointer movement is sampled along its line so fast swipes don't skip tiles ---------- */
function svgPoint(clientX, clientY) { const pt = board.createSVGPoint(); pt.x = clientX; pt.y = clientY; return pt.matrixTransform(board.getScreenCTM().inverse()); }
function cellAtPoint(p) {
  const L = game.L, cx = Math.floor((p.x - PAD) / CELL), cy = Math.floor((p.y - PAD) / CELL);
  if (cx < 0 || cy < 0 || cx >= L.w || cy >= L.h) return -1;
  const fx = (p.x - PAD) / CELL - cx, fy = (p.y - PAD) / CELL - cy;
  if (Math.abs(fx - 0.5) > 0.46 || Math.abs(fy - 0.5) > 0.46) return -2;   // small corner dead zone
  return cy * L.w + cx;
}
function adjacent(a, b) { const L = game.L; return Math.abs(a % L.w - b % L.w) + Math.abs(((a / L.w) | 0) - ((b / L.w) | 0)) === 1; }
function visitCell(c) {                      // one cell the finger is over: rewind, extend, or ignore
  if (c < 0 || game.locked) return;
  const head = game.path[game.path.length - 1];
  if (c === head) return;
  const idx = game.path.indexOf(c);
  if (idx >= 0) {
    let cut = idx; while (cut > 0 && game.rule.arrows && (game.path[cut] in game.L.arrows)) cut--;   // never stop on an arrow tile
    if (cut < game.lockFrom) { if (idx < game.lockFrom) toast('No way back past an arrow. Start over to retry.'); return; }   // shoved = committed
    game.path.length = cut + 1; game.snackIdx = game.L.snacks.filter(s => game.path.includes(s)).length; sfx.back(); drawPath(); updateRaccoon(); return;
  }
  if (!game.L.openArr[c]) return;
  if (adjacent(head, c)) { extend(c); return; }
  // the finger skipped a tile (corner cut or fast swipe): walk the shortest open, unvisited route of at most 3 steps
  const L = game.L, prev = new Map([[head, null]]), q = [[head, 0]];
  let hit = null;
  while (q.length && !hit) {
    const [cur, d] = q.shift(); if (d >= 3) continue;
    for (const nb of neighbors(L, cur)) {
      if (prev.has(nb) || game.path.includes(nb)) continue;
      prev.set(nb, cur); if (nb === c) { hit = nb; break; } q.push([nb, d + 1]);
    }
  }
  if (!hit) return;
  const route = []; for (let x = hit; x !== head; x = prev.get(x)) route.push(x);
  for (const x of route.reverse()) { if (game.locked) break; extend(x); }
}
function onDown(ev) {
  audio(); if (game.locked) return;
  const p = svgPoint(ev.clientX, ev.clientY), c = cellAtPoint(p);
  game.dragging = true; game.lastPt = p;
  try { board.setPointerCapture(ev.pointerId); } catch (e) {}
  visitCell(c);
}
function onMove(ev) {
  if (!game.dragging || game.locked) return;
  const p = svgPoint(ev.clientX, ev.clientY), last = game.lastPt || p;
  const dist = Math.hypot(p.x - last.x, p.y - last.y), steps = Math.max(1, Math.ceil(dist / (CELL / 5)));
  for (let s = 1; s <= steps; s++) {
    const q = { x: last.x + (p.x - last.x) * s / steps, y: last.y + (p.y - last.y) * s / steps };
    visitCell(cellAtPoint(q)); if (game.locked) break;
  }
  game.lastPt = p;
}
function onUp() { game.dragging = false; game.lastPt = null; }
function extend(c) {
  const L = game.L;
  const sIdx = L.snacks.indexOf(c);
  if (game.rule.snacks && sIdx >= 0 && sIdx !== game.snackIdx) { game.path.push(c); drawPath(); updateRaccoon(); fail('snack', c); return; }
  game.path.push(c); drawPath(); updateRaccoon();
  if (sIdx >= 0 && game.rule.snacks) { game.snackIdx++; sfx.snack(sIdx); sfx.crunch(); eatSnack(sIdx); } else sfx.step(game.path.length);
  if (game.rule.arrows && c in L.arrows && c !== L.exit) {          // pushed: the next tile is forced
    const d = ARROW[L.arrows[c]], x = c % L.w + d[0], y = ((c / L.w) | 0) + d[1];
    const t = (x < 0 || y < 0 || x >= L.w || y >= L.h) ? -1 : y * L.w + x;
    if (t < 0 || !L.openArr[t] || game.path.includes(t)) { shove(c, d, 240, () => fail('deadend')); return; }
    game.locked = true;
    shove(c, d, 240, () => { game.locked = false; if (game.path[game.path.length - 1] === c) { extend(t); game.lockFrom = game.path.length - 1; } });
    return;
  }
  if (c === L.exit) {
    const allVisited = game.path.length === L.openArr.reduce((a, b) => a + b, 0);
    if (game.rule.visitAll && !allVisited) { fail('missed'); return; }
    if (game.rule.snacks && game.snackIdx !== L.snacks.length) { fail('snack'); return; }
    win(); return;
  }
  const free = neighbors(L, c).filter(n => !game.path.includes(n));
  if (!free.length) fail('deadend');
}
function shove(cell, d, ms, done) {                  // struggles against the arrow, then gets pushed
  const [cx, cy] = center(game.L, cell), t0 = performance.now();
  sfx.back(); if (navigator.vibrate) navigator.vibrate([15, 20, 15, 20, 15]);
  (function step(now) {
    const t = Math.min(1, (now - t0) / ms);
    const jitter = t < 0.6 ? Math.sin(t * 60) * 7 : 0;           // vibrate against the push direction
    const lean = t < 0.6 ? -d[0] * 10 * (1 - t) : d[0] * 14 * (t - 0.6) / 0.4;
    racPos = [cx + lean + jitter * (d[1] !== 0 ? 1 : 0), cy + (d[1] !== 0 ? -d[1] * 10 * (1 - t) : 0) + jitter * (d[0] !== 0 ? 0.3 : 0)];
    idleT0 = now;
    if (t < 1) requestAnimationFrame(step); else done();
  })(t0);
}
function eatSnack(k) {                                   // cookie pops up, spins and vanishes like a picked-up coin
  const g = $('snack' + k); if (!g) return;
  const c = game.L.snacks[k], [sx, sy] = center(game.L, c), t0 = performance.now();
  g.setAttribute('opacity', 1);
  (function step(now) {
    const t = Math.min(1, (now - t0) / 420), up = 55 * Math.sin(t * Math.PI / 2), sc = t < 0.5 ? 1 + t * 0.7 : Math.max(0, 1.35 - (t - 0.5) * 2.7), rot = t * 540;
    g.setAttribute('transform', `translate(${sx},${sy - up}) rotate(${rot}) scale(${sc}) translate(${-sx},${-sy})`);
    g.setAttribute('opacity', 1 - t * t);
    if (t < 1) requestAnimationFrame(step); else g.setAttribute('opacity', 0);
  })(t0);
}
function updateRaccoon() {
  placeRaccoon(game.path[game.path.length - 1]);
  const fat = 1 + 0.12 * game.snackIdx;                // every cookie makes him rounder
  const b = $('rBelly'); if (b) b.setAttribute('transform', `translate(0,8) scale(${fat}) translate(0,-8)`);
}

function fail(why, cell) {
  game.locked = true; game.fails++; game.dragging = false;
  $('spotN').textContent = game.fails; $('spotted').classList.add('show');
  sfx.fail(); shakeUntil = performance.now() + 500; $('raccoon').classList.add('dead');
  if (navigator.vibrate) navigator.vibrate(60);
  if (why === 'missed') for (let i = 0; i < game.L.w * game.L.h; i++) if (game.L.openArr[i] && !game.path.includes(i)) $('tile' + i).classList.add('missed');
  if (why === 'snack') { const k = game.L.snacks.indexOf(cell); const g = $('snack' + (k >= 0 ? k : game.snackIdx)); if (g) g.classList.add('missed'); }
  log.event('level_fail', { lvl: game.n, why, len: game.path.length });
  setTimeout(() => { game.path = [game.L.start]; game.snackIdx = 0; game.lockFrom = 0; render(); game.locked = false; }, why === 'deadend' ? 700 : 1100);
}
function win() {
  game.locked = true; game.dragging = false;
  log.event(game.daily ? 'daily_solved' : 'level_complete', { lvl: game.n, ms: Date.now() - game.started, fails: game.fails });
  if (!game.daily) saveMax(game.n + 1);
  sfx.win(); if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
  const t1 = performance.now(), r = $('raccoon'), [ex, ey] = center(game.L, game.L.exit);
  (function pop(now) {                        // squash-and-stretch at the door, then slip out through it
    const s = Math.min(1, (now - t1) / 800);
    const sq = s < 0.5 ? 1 + Math.sin(s * 2 * Math.PI) * 0.28 : 1;
    const out = s > 0.5 ? (s - 0.5) * 2 : 0;
    $('rBody').setAttribute('transform', `scale(${1 / sq},${sq})`);
    r.setAttribute('opacity', 1 - out);
    racPos = [ex, ey - out * 30];
    if (s < 1) requestAnimationFrame(pop);
  })(t1);
  setTimeout(() => { if (game.daily) finishDaily(); else if (game.n >= LEVEL_COUNT) endScreen(); else loadLevel(game.n + 1); }, 950);
}

/* ---------- Daily puzzle: same board for everyone each day, streak, share ---------- */
const DAILY_EPOCH = 20732;   // Oct 6 2026 → daily #1
function dailyIndex() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function dailyState() { try { return JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch (e) { return {}; } }
function saveDaily(st) { try { localStorage.setItem(DAILY_KEY, JSON.stringify(st)); } catch (e) {} }
function fmt(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function loadDaily() {
  const day = dailyIndex(), l = DAILY[day % DAILY.length], st = dailyState();
  game.daily = true; game.dailyDay = day; game.n = 0; game.L = l; game.rule = RULES[l.rule]; game.path = [l.start]; game.snackIdx = 0;
  game.locked = false; game.fails = 0; game.started = Date.now(); game.dragging = false; game.lockFrom = 0;
  document.documentElement.setAttribute('data-kitchen', 1);
  $('levelNum').firstElementChild.textContent = 'Daily'; $('lvlText').textContent = '#' + (day - DAILY_EPOCH); $('spotN').textContent = 0; $('spotted').classList.remove('show');
  const RULE_LINE = { 3: 'Snacks in order, every tile', 4: 'Arrows shove you. Snacks, every tile' };
  $('hintLine').textContent = RULE_LINE[l.rule]; $('dailyBtn').textContent = 'Levels';
  render();
  log.event('daily_open', { day, rule: l.rule, done: !!(st.done && st.done[day]) });
  if (!introSeen().includes(l.rule)) showIntro(l.rule);
  if (st.done && st.done[day]) showDailyCard(st.done[day], st, false);
}
function finishDaily() {
  const st = dailyState(), day = game.dailyDay, ms = Date.now() - game.started;
  st.done = st.done || {}; const first = !st.done[day];
  if (first) {
    st.done[day] = { ms, fails: game.fails };
    st.streak = (st.lastDay === day - 1) ? (st.streak || 0) + 1 : 1; st.lastDay = day; saveDaily(st);
    log.event('daily_complete', { day, ms, fails: game.fails, streak: st.streak });
  }
  showDailyCard(st.done[day], st, first);
}
function showDailyCard(res, st, first) {
  $('dailyTitle').textContent = first ? 'Loot secured' : 'Today is done';
  $('dailyTime').textContent = fmt(res.ms);
  $('dailyText').textContent = `Spotted ${res.fails} time${res.fails === 1 ? '' : 's'} · streak ${st.streak || 1} day${(st.streak || 1) === 1 ? '' : 's'} · new puzzle at midnight`;
  $('dailyCard').classList.add('show'); game.locked = true;
}
$('dailyShare').addEventListener('click', async () => {
  const st = dailyState(), day = game.dailyDay, r = st.done[day];
  const text = `Trash Panda Run daily #${day - DAILY_EPOCH}: ${fmt(r.ms)}, spotted ${r.fails}x, streak ${st.streak}. Beat my time: ${location.origin}${location.pathname}#daily`;
  log.event('share_clicked', { day });
  try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); toast('Copied, paste it anywhere'); } } catch (e) {}
});
$('dailyBack').addEventListener('click', () => { $('dailyCard').classList.remove('show'); loadLevel(Math.min(maxLevel(), LEVEL_COUNT)); });
$('dailyBtn').addEventListener('click', () => { if (game.daily) loadLevel(Math.min(maxLevel(), LEVEL_COUNT)); else loadDaily(); });

/* ---------- End screen, toast, debug ---------- */
function endScreen() {
  sfx.clear(); log.event('all_levels_complete', {});
  const s = log.summary();
  $('endStats').textContent = `${s.levelsDone} levels, spotted ${s.fails} times, about ${Math.round(s.playSecs / 60)} minutes.`;
  $('playCode').textContent = log.playCode(); $('end').classList.add('show');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
async function copyText(txt) { try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch (e) { toast('Copy failed'); } }
function showDebug() {
  const d = $('debug'); d.classList.add('show');
  let html = `<p><b>${VERSION}</b> · ${LEVEL_COUNT} levels · <button id="dbgLog">Copy full log</button> <button id="dbgClose">Close</button></p><p>?debug=1&level=N jumps to level N.</p>`;
  html += '<table><tr><th>#</th><th>rule</th><th>size</th><th>score</th><th>info</th></tr>';
  for (const L of LEVELS) html += `<tr><td>${L.n}</td><td>${L.rule}</td><td>${L.w}×${L.h}</td><td>${L.score}</td><td>${Object.entries(L.info).map(([k, v]) => k + ' ' + v).join(', ')}</td></tr>`;
  d.innerHTML = html + '</table>';
  $('dbgLog').onclick = () => copyText(JSON.stringify(log.data));
  $('dbgClose').onclick = () => d.classList.remove('show');
}

const params = new URLSearchParams(location.search);
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
const levelParam = params.get('level') || hashParams.get('level');
/* ---------- Progress + level menu ---------- */
function maxLevel() { try { return Math.max(1, parseInt(localStorage.getItem(MAX_KEY)) || 1); } catch (e) { return 1; } }
function saveMax(n) { try { if (n > maxLevel()) localStorage.setItem(MAX_KEY, String(Math.min(LEVEL_COUNT, n))); } catch (e) {} }
const RULE_NAMES = { 1: 'Reach the window', 2: 'Every tile', 3: 'Snacks in order', 4: 'Slippery arrows' };
function openMenu() {
  const wrap = $('menuGrids'); wrap.innerHTML = ''; const mx = maxLevel();
  for (const r of [1, 2, 3, 4]) {
    const h = document.createElement('h2'); h.textContent = RULE_NAMES[r] + '  ⓘ'; h.style.cursor = 'pointer';
    h.onclick = () => { $('menu').classList.remove('show'); showIntro(r); }; wrap.appendChild(h);
    const g = document.createElement('div'); g.className = 'lgrid';
    LEVELS.filter(l => l.rule === r).forEach(l => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'lcell'; b.textContent = l.n;
      if (l.n < mx) b.classList.add('done'); if (l.n === game.n) b.classList.add('current');
      b.disabled = l.n > mx && !params.get('debug');
      b.onclick = () => { $('menu').classList.remove('show'); log.event('menu_jump', { from: game.n, to: l.n }); loadLevel(l.n); };
      g.appendChild(b);
    });
    wrap.appendChild(g);
  }
  $('menu').classList.add('show'); log.event('menu_open', { lvl: game.n });
}
$('menuBtn').addEventListener('click', openMenu);
let titleTaps = 0;
$('menuTitle').addEventListener('click', () => { if (++titleTaps >= 5) { titleTaps = 0; saveMax(LEVEL_COUNT); toast('All levels unlocked'); openMenu(); } });
$('menuClose').addEventListener('click', () => $('menu').classList.remove('show'));

board.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
$('retry').addEventListener('click', () => { if (game.locked) return; game.path = [game.L.start]; game.snackIdx = 0; game.lockFrom = 0; drawPath(); updateRaccoon(); sfx.back(); log.event('restart', { lvl: game.n }); });
$('copyCode').addEventListener('click', () => copyText(log.playCode()));
$('replay').addEventListener('click', () => { $('end').classList.remove('show'); loadLevel(1); });
let verTaps = 0;
$('ver').addEventListener('click', () => { if (++verTaps >= 5) { verTaps = 0; copyText(JSON.stringify(log.data)); } });
let startLevel = 1;
try { startLevel = parseInt(localStorage.getItem(PROG_KEY)) || 1; } catch (e) {}
if (levelParam) { startLevel = Math.min(LEVEL_COUNT, Math.max(1, parseInt(levelParam) || 1)); saveMax(startLevel); log.event('level_param', { lvl: startLevel }); }
startLevel = Math.min(startLevel, maxLevel());
if (params.get('debug')) showDebug();
if (location.hash.includes('daily')) loadDaily(); else loadLevel(startLevel);
</script>
</body>
</html>
